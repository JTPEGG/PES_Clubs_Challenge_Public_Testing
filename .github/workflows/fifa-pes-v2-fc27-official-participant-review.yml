name: PES V2 FC27 official 2026-27 club roster and movement checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_fc27_official_season_participants.py'
      - 'test_audit_fc27_official_season_participants.py'
      - 'data/warehouse/fc27_2026_27_independent_roster_and_rules_checks.json'
      - '.github/workflows/fifa-pes-v2-fc27-official-participant-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject truncated source club period and fabricated league records
        run: python -m unittest -v test_audit_fc27_official_season_participants
      - name: Read verified FC27 659 eligible named domestic source clubs
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-FC27-2026-27-ALL-659-ACTIVE-SOURCE-CLUB-DOMESTIC-LEAGUES
          run-id: 39578623604
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline/
      - name: Audit official 2026-27 actual season club rosters and 2026-27 rule changes
        run: |
          python -u -m scripts.audit_fc27_official_season_participants \
            --registry baseline/FC27_2026_27_ALL_659_SOURCE_CLUB_HOME_COMPETITIONS.sqlite \
            --review data/warehouse/fc27_2026_27_independent_roster_and_rules_checks.json \
            --output release/
      - name: Fail on unexpected identity counts and ensure historical career still blocked
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path("release")
          x=json.loads((p/"FC27_SEASON_ROSTER_AND_MOVEMENT_RULE_AUDIT.json").read_text())
          assert x["original_FC27_game_clubs"]==670
          assert x["domestic_source_competitions_named"]==659
          assert x["eligible_FC27_game_clubs"]==659
          assert x["excluded_original_clubs"]==11
          assert x["official_season_leagues_participant_lists_checked"]==3
          assert x["participant_lists_fully_matching_original_game"]>=1
          assert x["independent_same_year_original_club_matches"]>=40
          assert x["original_clubs_missing_from_actual_season_lists"]==0
          assert x["actual_season_clubs_missing_from_original_game"]==0
          assert x["new_versioned_official_movement_regime_records"]==1
          assert not x["career_ready"] and not x["fc27_2026_27_all_playable_rosters_certified"]
          with (p/"FC27_REAL_WORLD_CLUB_ROSTER_EXCEPTIONS.csv").open(encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          assert not rows
          print(json.dumps(x,indent=2))
          print("OFFICIAL_ROSTER_CONFLICTS",rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PES-V2-FC27-659-ACTIVE-2026-27-ROSTER-AND-REGIME-REVIEW
          path: release/
          retention-days: 30
          if-no-files-found: error
