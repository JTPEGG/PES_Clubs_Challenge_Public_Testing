name: PES V2 historical competition 22-edition gap triage
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_historical_competition_gaps.py'
      - 'data/warehouse/historical_club_identity_disambiguation_v1.json'
      - 'test_historical_competition_gap_audit.py'
      - '.github/workflows/fifa-pes-v2-competition-gap-analysis.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-historical-competition-gap-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  source-preserving-gap-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test gap-cause classification, exact keys and failure safety
        run: python -m unittest -v test_historical_competition_gap_audit
      - name: Read approved original men-only FIFA club database
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-22-YEAR-MENS-ONLY-CLUBS-LEAGUES-AND-SQUADS
          run-id: 39409971210
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/
      - name: Read latest verified 447-season source-backed historical competition registry
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-22-SEASON-COMPETITION-REGISTRY-SOURCED-AND-REVIEWED
          run-id: 39501911329
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/
      - name: Produce fully enumerated source identity and country review backlog
        run: |
          python -u -m scripts.audit_historical_competition_gaps \
            --source input/PES_V2_22_EDITION_CLUB_SQUAD_MAP.sqlite \
            --registry input/HISTORICAL_COMPETITION_REGISTER.sqlite \
            --output release/ \
            --identity-review data/warehouse/historical_club_identity_disambiguation_v1.json
      - name: Assert complete cause accounting and no invented competition identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          d=Path('release')
          report=json.loads((d/'HISTORICAL_COMPETITION_GAP_AUDIT.json').read_text())
          assert report['source_clubs']==13104
          assert report['editions']==22
          assert report['independent_league_seasons']==447
          assert report['unresolved']==7163
          assert report['linked_provisional_evidence']==5941
          assert report['alias_identity_review']==1407
          assert report['uncrosswalked_name_candidates']==0
          assert report['game_id_disambiguations']==2
          assert sum(report['reasons_unresolved'].values())==7163
          assert not report['career_ready_editions']
          with (d/'HISTORICAL_COMPETITION_CLUB_TRIAGE.csv').open(
             encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==13104
          assert all(row['Career_Ready']=='no' for row in rows)
          assert all(row['Evidence_Country']=='' or row['Evidence_Competition']!=''
                     for row in rows)
          assert all(row['Candidate_Country_Review_Only']=='' or row['Evidence_Competition']==''
                     for row in rows)
          print('CONFIRMED classification of all 13,104 source club-years without nationality guessing')
          print(json.dumps({k:v for k,v in report.items()
             if k in ('reasons_unresolved','all_confidence_categories',
                      'original_source_group_review_rows','top_unresolved_editions')},indent=2))
          PY
      - name: Upload full source group priorities, alias and per-year cause backlog
        uses: actions/upload-artifact@v4
        with:
          name: PES-V2-HISTORICAL-COMPETITION-GAP-CAUSES-AND-SOURCE-PRIORITIES
          path: release/
          retention-days: 30
          if-no-files-found: error
