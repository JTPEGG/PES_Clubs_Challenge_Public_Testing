name: FC27 real 659-club autonomous market QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fc27-warehouse-659-market-qa.yml'
      - 'scripts/fc27_warehouse_world_bridge.py'
      - 'scripts/fc27_warehouse_659_market_smoke.py'
      - 'world_ai_world.py'
      - 'world_fc27_ai_recruitment.py'
      - 'world_recruitment_strategy.py'
      - 'world_live_buying.py'
      - 'world_ai_replacement_outlook.py'
      - 'world_squad_planner.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: fc27-659-source-market-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  real-world-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        opportunity_scale: [1,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Download immutable approved 659-club populated FC27 source warehouse
        uses: actions/download-artifact@v4
        with:
          name: FC27-POPULATED-UNIFIED-REFERENCE-WAREHOUSE-V1
          run-id: 39616187183
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: warehouse-source/
      - name: Verify original reference is exactly 659 clubs and 17,593 squad registrations
        run: |
          python - <<'PY'
          import sqlite3
          p="warehouse-source/FC27_UNIFIED_REFERENCE_WAREHOUSE_AI_DIMENSIONS_V2.sqlite"
          with sqlite3.connect("file:"+p+"?mode=ro",uri=True) as c:
              assert c.execute("SELECT COUNT(*) FROM wh_fc27_clubs").fetchone()[0]==659
              assert c.execute("SELECT COUNT(*) FROM wh_fc27_players").fetchone()[0]==17593
              assert c.execute("SELECT COUNT(*) FROM wh_fc27_starting_rosters").fetchone()[0]==17593
              assert c.execute("SELECT COUNT(*) FROM wh_fc27_competitions").fetchone()[0]==53
          print("SOURCE 659 VERIFIED: not legacy 670 edition")
          PY
      - name: Build independent, source-identity-preserving 659-club career-engine world
        run: |
          mkdir -p qa659
          python -u -m scripts.fc27_warehouse_world_bridge \
            --warehouse warehouse-source/FC27_UNIFIED_REFERENCE_WAREHOUSE_AI_DIMENSIONS_V2.sqlite \
            --target qa659/FC27_659_SOURCE_DISPOSABLE_WORLD.sqlite
      - name: Simulate one full autonomous transfer window with all 659 clubs
        run: |
          python -u -m scripts.fc27_warehouse_659_market_smoke \
            --world qa659/FC27_659_SOURCE_DISPOSABLE_WORLD.sqlite \
            --opportunity-scale ${{ matrix.opportunity_scale }} \
            --output qa659/FC27_659_ACTUAL_AI_WINDOW_AUDIT_${{ matrix.opportunity_scale }}x.json
      - name: Verify exact source counts, final window and no fake registration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("qa659/FC27_659_ACTUAL_AI_WINDOW_AUDIT_${{ matrix.opportunity_scale }}x.json")
          a=json.loads(p.read_text())
          assert a["source_clubs"]==659
          assert a["source_competitions"]==53
          assert a["source_players"]==17593
          assert a["window_minutes"]==30
          assert a["modelled_ai_club_contexts_copied"]==659
          assert len(a["actual_transfer_details"])==a["in_game_final_registrations"]
          assert a["opportunity_scale_QA_only"]==${{ matrix.opportunity_scale }}
          assert a["extra_QA_opportunities_not_forced_transfers"]
          assert a["senior_first_team_deals"]+a["prospect_deals"]==a["in_game_final_registrations"]
          assert a["player_registration_reconciled"] is True
          assert a["no_production_career_modified"] is True
          assert a["no_PES_export"] is True
          assert a["in_game_final_registrations"]>=0
          print("FULL 659-CLUB GAME-WORLD QA COMPLETED")
          PY
      - name: Publish immutable source-mapping audit and actual autonomous-market outcomes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FC27-659-CLUB-AUTONOMOUS-AUDIT-${{ matrix.opportunity_scale }}X
          path: |
            qa659/*.json
          retention-days: 30
          if-no-files-found: warn
