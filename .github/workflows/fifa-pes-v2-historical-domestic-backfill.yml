name: PES V2 historical domestic league bulk source backfill
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_historical_domestic_backfill.py'
      - 'test_collect_historical_domestic_backfill.py'
      - '.github/workflows/fifa-pes-v2-historical-domestic-backfill.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-historical-bulk-source-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check starting edition and no wrong-year assignments
        run: python -m unittest -v test_collect_historical_domestic_backfill
      - name: Read already verified 367 domestic league-season source register
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-22-SEASON-COMPETITION-REGISTRY-SOURCED-AND-REVIEWED
          run-id: 39467266710
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous/
      - name: Fetch only missing original historical league-seasons from pinned public CC0 sources
        run: |
          python -u -m scripts.collect_historical_domestic_backfill \
            --registry previous/HISTORICAL_COMPETITION_REGISTER.sqlite \
            --output release/
      - name: Check all imported seasons have actual source club participants
        run: |
          python - <<'PY'
          import json,csv,collections
          from pathlib import Path
          p=Path('release')
          d=json.loads((p/'EXPANDED_HISTORICAL_SOURCE_AUDIT.json').read_text())
          with (p/'EXPANDED_DOMESTIC_LEAGUE_SEASONS.csv').open(encoding='utf-8-sig') as f:
              seasons=list(csv.DictReader(f))
          with (p/'EXPANDED_DOMESTIC_SOURCE_CLUBS.csv').open(encoding='utf-8-sig') as f:
              clubs=list(csv.DictReader(f))
          assert d['base_existing_division_seasons']==367
          assert len(seasons)==d['new_domestic_league_seasons']
          assert len(clubs)==d['new_fixture_club_seasons']
          assert len({(x['Edition'],x['League_Code']) for x in seasons})==len(seasons)
          assert not d['career_ready'] and d['game_squads_generated']==0
          assert len(seasons)>=15
          assert {'br.1','jp.1','mx.1','tr.1','cn.1'}.issubset(
             {x['League_Code'] for x in seasons})
          totals=collections.Counter((r['Edition'],r['League_Code']) for r in clubs)
          assert all(totals[(s['Edition'],s['League_Code'])]==int(s['Parsed_Teams']) for s in seasons)
          assert all(s['Edition']!='2025' for s in seasons)
          print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PES-V2-BULK-PINNED-HISTORICAL-DOMESTIC-SOURCE-CLUB-RECOVERY
          path: release/
          retention-days: 30
          if-no-files-found: error
