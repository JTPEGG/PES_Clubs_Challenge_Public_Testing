name: PES V2 pinned English MLS and Argentina historical competitions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_historical_competition_supplement.py'
      - 'test_collect_historical_competition_supplement.py'
      - '.github/workflows/fifa-pes-v2-competition-supplement.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-competition-supplement-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  source-membership-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard season mapping and fixture parser
        run: python -m unittest -v test_collect_historical_competition_supplement
      - name: Read previously pinned 232 domestic league-seasons
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-HISTORICAL-DOMESTIC-LEAGUE-MEMBERSHIP-EVIDENCE-2011-2027
          run-id: 39449937724
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous/
      - name: Collect previously missing English league seasons and calendar-year MLS Argentina
        run: |
          python -u -m scripts.collect_historical_competition_supplement \
            --recent previous/PINNED_OPENFOOTBALL_LEAGUES_BY_SEASON.csv \
            --output release/
      - name: Validate source-team totals and no invented edition or players
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path("release")
          audit=json.loads((d/"PINNED_SUPPLEMENT_AUDIT.json").read_text())
          with (d/"PINNED_SUPPLEMENT_DOMESTIC_LEAGUE_SEASONS.csv").open(
               encoding="utf-8-sig",newline="") as f:
               seasons=list(csv.DictReader(f))
          with (d/"PINNED_SUPPLEMENT_DOMESTIC_SOURCE_CLUBS.csv").open(
               encoding="utf-8-sig",newline="") as f:
               clubs=list(csv.DictReader(f))
          assert len(seasons)==audit["additional_league_seasons"]
          assert len(clubs)==audit["additional_independent_club_seasons"]
          assert audit["editions_considered"]==22
          assert audit["historical_player_rosters_created"]==0
          assert audit["all_links_staging_only"] and not audit["careers_ready"]
          assert len(seasons)>=30
          assert sum(x["League_Code"]=="us.mls" for x in seasons)>=15
          assert sum(x["League_Code"].startswith("en.") for x in seasons)>=10
          assert sum(x["League_Code"]=="ar.1" for x in seasons)>=4
          assert all(int(s["Declared_Teams"])==int(s["Parsed_Teams"]) for s in seasons)
          assert all(int(s["Edition"])!=2025 for s in seasons)
          assert len({(s["Edition"],s["League_Code"]) for s in seasons})==len(seasons)
          print(json.dumps(audit,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PES-V2-PINNED-ENGLISH-MLS-ARGENTINA-HISTORIC-DOMESTIC-MEMBERSHIPS
          path: release/
          retention-days: 30
          if-no-files-found: error
