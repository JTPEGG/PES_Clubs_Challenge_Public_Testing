name: FC27 free-agent source snapshot audit
on:
  push:
    paths:
      - '.github/workflows/fc27-free-agent-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe FC27 unassigned player public source
        run: |
          python - <<'PY'
          import urllib.request,re
          from html import unescape
          from pathlib import Path
          Path('free-source').mkdir(exist_ok=True)
          for page in [1,2,3,4,5,6,7,8]:
            url='https://www.fifacm.com/free-agents'+(f'?page={page}' if page!=1 else '')
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; FC27-PES-test/1.0)'})
            try:
              with urllib.request.urlopen(req,timeout=18) as r:
                html=r.read().decode('utf-8',errors='replace')
              Path(f'free-source/page{page}.html').write_text(html,encoding='utf-8')
              print('FC27_FREE_AGENT_SOURCE',page,'HTTP200',len(html),
                  'players links',len(re.findall(r'/players/\\d+',html)),
                  'sancho',bool(re.search('Sancho',html,re.I)),flush=True)
              if page==1:
                i=html.lower().find('giorgian')
                print('FC27_SOURCE_SNIPPET',repr(html[i-300:i+200]),flush=True)
            except Exception as e:
              print('FC27_FREE_AGENT_SOURCE',page,'FAILED',repr(e),flush=True)
          for name,url in [
            ('profile225645','https://www.fifacm.com/player/225645/giorgian-de-arrascaeta'),
            ('profile233049','https://www.fifacm.com/player/233049/jadon-sancho')]:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=22) as r:
                html=r.read().decode('utf-8',errors='replace')
              Path(f'free-source/{name}.html').write_text(html,encoding='utf-8')
              print('FC27_PROFILE_SOURCE',name,len(html),
                    'born',html.lower().find('birth'),flush=True)
            except Exception as exc:
              print('FC27_PROFILE_SOURCE_FAILED',name,repr(exc),flush=True)
          PY
      - name: Archive source HTML for parsing and offline audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FC27-FREE-AGENTS-HTML-SOURCE-QA
          path: free-source/
          retention-days: 1
          if-no-files-found: warn
