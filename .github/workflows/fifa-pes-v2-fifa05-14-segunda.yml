name: PES V2 FIFA05-14 Spanish Segunda source club recovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/recover_fifa05_14_spanish_segunda.py'
      - 'test_recover_fifa05_14_spanish_segunda.py'
      - '.github/workflows/fifa-pes-v2-fifa05-14-segunda.yml'
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test authentic 22-club results and no imaginary clubs
        run: python -m unittest -v test_recover_fifa05_14_spanish_segunda
      - name: Retrieve immutable original FIFA/PES V2 club catalogue
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-22-YEAR-MENS-ONLY-CLUBS-LEAGUES-AND-SQUADS
          run-id: 39409971210
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original/
      - name: Read official dated Spanish second division fixture member clubs from pinned CC0 repo
        run: |
          python -u -m scripts.recover_fifa05_14_spanish_segunda \
            --source original/PES_V2_22_EDITION_CLUB_SQUAD_MAP.sqlite \
            --output release/
      - name: Validate 2004-05 to 2013-14 source memberships and isolation
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('release')
          x=json.loads((d/'FIFA05_14_SPANISH_SEGUNDA_SOURCE_AUDIT.json').read_text())
          with (d/'FIFA05_14_SPANISH_SEGUNDA_GAME_NAME_MATCHES.csv').open(encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert x['independent_domestic_league_seasons']==10
          assert x['actual_dated_fixture_club_memberships']==220
          assert len(rows)==x['unique_provisional_game_club_name_matches']
          assert len(set((r['Edition'],r['FIFA_Club_Key']) for r in rows))==len(rows)
          assert not x['careers_ready'] and not x['game_squads_modified']
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PES-V2-PINNED-FIFA05-14-SEGUNDA-DIVISION-GAME-CLUB-SOURCES
          path: release/
          retention-days: 30
          if-no-files-found: error
