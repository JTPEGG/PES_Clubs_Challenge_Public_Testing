name: PES 2.0 world checks
on:
  push:
    branches: [main]
    paths:
      - 'world_*.py'
      - 'test_world_explorer.py'
      - 'world_import.py'
      - 'world_valuation.py'
      - 'test_world_import.py'
      - 'test_world_squad_planner.py'
      - 'test_world_career_lifecycle.py'
      - 'test_world_historical_profiles.py'
      - 'test_world_recruitment_strategy.py'
      - 'world_finance.py'
      - 'test_world_finance.py'
      - 'world_market.py'
      - 'test_world_market.py'
      - 'world_careers.py'
      - 'world_careers_ui.py'
      - 'test_world_careers.py'
      - 'world_career_play.py'
      - 'test_world_career_play.py'
      - 'world_reputation.py'
      - 'test_world_reputation.py'
      - 'world_reputation_v2.py'
      - 'world_reputation_v2_ui.py'
      - 'test_world_reputation_v2.py'
      - 'world_reputation_progression.py'
      - 'world_reputation_progression_ui.py'
      - 'test_world_reputation_progression.py'
      - 'world_reputation_achievements.py'
      - 'test_world_reputation_achievements.py'
      - 'world_prestige_calibration.py'
      - 'world_prestige_calibration_ui.py'
      - 'test_world_prestige_calibration.py'
      - 'world_prestige_full.py'
      - 'world_prestige_full_ui.py'
      - 'test_world_prestige_full.py'
      - 'world_player_decisions.py'
      - 'world_player_decisions_ui.py'
      - 'test_world_player_decisions.py'
      - 'test_world_player_decisions_v2.py'
      - 'season_rules.py'
      - 'test_world_v2.py'
      - 'test_season_rules.py'
      - 'import_fc27_ratings.py'
      - '.github/workflows/world-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'world_*.py'
      - 'test_*.py'
      - 'requirements.txt'
      - '.github/workflows/world-checks.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask==3.0.3'
      - name: Validate season rules and world database
        run: python -m unittest -v test_season_rules test_world_v2 test_world_explorer test_world_import test_world_finance test_world_market test_world_careers test_world_career_play test_world_reputation test_world_reputation_v2 test_world_reputation_progression test_world_reputation_achievements test_world_prestige_calibration test_world_prestige_full test_world_player_decisions test_world_player_decisions_v2 test_world_squad_planner test_world_career_lifecycle test_world_historical_profiles test_world_recruitment_strategy
