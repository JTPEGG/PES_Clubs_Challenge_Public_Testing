name: PES V2 restore original FIFA15 York City player source
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/recover_fifa15_york_city_original_players.py'
      - 'test_recover_fifa15_york_city_original_players.py'
      - '.github/workflows/fifa-pes-v2-fifa15-york-original-players.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check edition isolation and original game player attributes
        run: python -m unittest -v test_recover_fifa15_york_city_original_players
      - name: Download cryptographically pinned FIFA15-23 original men's player database
        run: |
          python - <<'PY'
          import hashlib,urllib.request
          from scripts.recover_fifa15_york_city_original_players import SOURCE_URL,PIN_SHA
          digest=hashlib.sha256()
          size=0
          with urllib.request.urlopen(SOURCE_URL,timeout=160) as source,open('original_male_players_legacy.csv','wb') as sink:
              for chunk in iter(lambda:source.read(1048576),b''):
                  size+=len(chunk)
                  if size>120000000:raise ValueError('Original archive exceeds expected size')
                  digest.update(chunk);sink.write(chunk)
          assert digest.hexdigest()==PIN_SHA,(digest.hexdigest(),size)
          print('Pinned historical original FIFA player archive',size,'bytes verified')
          PY
      - name: Read only same-year original FIFA15 York City EA team 1948 players
        run: |
          python -u -m scripts.recover_fifa15_york_city_original_players \
            --source original_male_players_legacy.csv \
            --output release/
      - name: Validate zero invented York City players and complete source row preservation
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path('release')
          report=json.loads((p/'FIFA15_YORK_CITY_REAL_GAME_PLAYER_RECOVERY_AUDIT.json').read_text())
          with (p/'FIFA15_YORK_CITY_SOURCE_ATTRIBUTES_FROM_PINNED_GAME.csv').open(encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert report['fifa_version']==15
          assert report['original_game_team_id']==1948
          assert len(rows)==report['original_players_recovered']
          assert len(set(x['player_id'] for x in rows))==len(rows)
          assert all(str(x['fifa_version'])=='15' and int(float(x['club_team_id']))==1948 for x in rows)
          assert report['original_fifa_attribute_columns']>=20
          assert not report['PES_conversion_completed']
          assert not report['career_activation_approved']
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PES-V2-FIFA15-REAL-YORK-CITY-ORIGINAL-GAME-PLAYER-ROSTER
          path: release/
          retention-days: 30
          if-no-files-found: error
