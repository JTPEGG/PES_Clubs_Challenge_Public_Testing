name: FC27 populated unified warehouse reference build
on:
  workflow_dispatch:
  push:
    paths:
      - 'warehouse/fc27_populated_reference_v1.sql'
      - 'scripts/build_fc27_populated_warehouse.py'
      - 'test_fc27_populated_warehouse.py'
      - 'warehouse/fc27_reference_reader.py'
      - 'warehouse/fc27_disposable_career_overlay.sql'
      - 'warehouse/fc27_disposable_career.py'
      - 'warehouse/fc27_decision_dimensions_v1.sql'
      - 'warehouse/fc27_enrich_decision_dimensions.py'
      - 'test_fc27_decision_dimensions.py'
      - 'test_fc27_reference_reader.py'
      - '.github/workflows/fc27-populated-warehouse.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: fc27-populated-warehouse-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build-frozen-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing architecture and populated reference constraints
        run: python -m unittest -v test_warehouse_schema_v1 test_fc27_populated_warehouse test_fc27_reference_reader test_fc27_decision_dimensions
      - name: Obtain frozen tested FC27 competition world
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-FC27-2026-27-ALL-659-ACTIVE-SOURCE-CLUB-DOMESTIC-LEAGUES
          run-id: 39602792857
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-world/
      - name: Obtain frozen reviewed 22-edition contracts and existing loans
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-MENS-22-EDITION-STARTING-WAGES-CONTRACTS-LOANS
          run-id: 39423495384
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-contracts/
      - name: Obtain frozen validated club finance game-model inputs
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-MENS-22-SEASON-CLUB-FINANCIALS-REVIEW
          run-id: 39427144648
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-finance/
      - name: Create independent FC27 warehouse with no career changes
        run: |
          python -u -m scripts.build_fc27_populated_warehouse \
            --world source-world/FC27_2026_27_ALL_659_SOURCE_CLUB_HOME_COMPETITIONS.sqlite \
            --contracts source-contracts/PES_V2_MENS_22_EDITION_CONTRACTS_AND_LOANS.sqlite \
            --club-finances source-finance/PES_V2_HISTORICAL_CLUB_FINANCIALS.sqlite \
            --output fc27-warehouse/FC27_UNIFIED_REFERENCE_WAREHOUSE_V1.sqlite
      - name: Assert source-key parity and disclosed coverage gaps
        run: |
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          target=Path("fc27-warehouse/FC27_UNIFIED_REFERENCE_WAREHOUSE_V1.sqlite")
          audit=json.loads(target.with_suffix(".audit.json").read_text())
          assert audit["reference_clubs"]==659
          assert audit["reference_competitions"]==53
          assert audit["intended_playable_competitions"]==17
          assert audit["intended_playable_clubs"]==344
          assert audit["unified_registered_players"]==17593
          assert audit["source_mens_player_records"]==17849
          assert audit["out_of_scope_source_player_rows_retained_only_in_archive"]==256
          assert audit["normalized_player_attributes"]==17593*29
          assert audit["starting_player_contracts"]==17593
          assert audit["starting_club_finance_profiles"]==659
          assert audit["playable_starting_roster_players"]==9269
          assert audit["sourced_season_end_routes"]==16
          assert audit["known_coverage_gap_domains"]>=5
          assert audit["snapshot_lifecycle"]=="frozen_reference_not_live_career"
          with sqlite3.connect(target) as db:
              db.execute("PRAGMA foreign_keys=ON")
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert not db.execute("PRAGMA foreign_key_check").fetchall()
              assert db.execute("SELECT COUNT(DISTINCT club_key) FROM wh_fc27_clubs").fetchone()[0]==659
              assert db.execute("SELECT COUNT(DISTINCT player_key) FROM wh_fc27_players").fetchone()[0]==17593
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_player_attributes WHERE rating_layer='pes2020_core_estimate'").fetchone()[0]==17593*25
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_player_attributes WHERE rating_layer='pes2020_auxiliary_estimate'").fetchone()[0]==17593*4
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_source_manifest").fetchone()[0]==3
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_club_financials WHERE finance_provenance!='game_model_estimate'").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_competitions WHERE country='United States' AND intended_playable=1").fetchone()[0] in (0,1)
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_movement_routes WHERE upper_code='2027:us.mls'").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_coverage_gaps WHERE domain='managers' AND coverage_status='not_populated'").fetchone()[0]==1
              assert db.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name LIKE 'world_career_%'").fetchone()[0]==0
          from warehouse.fc27_reference_reader import FC27WarehouseReader
          with FC27WarehouseReader(target) as wh:
              playable=wh.get_playable_competitions()
              assert len(playable)==17
              assert wh.snapshot_health()["players"]==17593
              assert wh.snapshot_health()["ratings"]==17593*29
              assert len(wh.get_known_gaps())>=5
              named_club=db.execute("SELECT club_key FROM wh_fc27_clubs ORDER BY club_key LIMIT 1").fetchone()[0]
              assert wh.get_club(named_club)["club_key"]==named_club
              roster_club=db.execute("SELECT club_key FROM wh_fc27_starting_rosters LIMIT 1").fetchone()[0]
              roster=wh.get_starting_roster(roster_club)
              assert roster
              assert wh.get_player(roster[0]["player_key"]) is not None
              assert wh.get_season_end_route("2027:us.mls") is None
          print("REAL FC27 659-CLUB / 17593-PLAYER POPULATED REFERENCE WAREHOUSE AND CAREER READ ADAPTER VERIFIED")
          PY
      - name: Verify isolated disposable career seeding and independent registration history
        run: |
          python - <<'PY'
          import json,sqlite3,tempfile
          from pathlib import Path
          from warehouse.fc27_disposable_career import seed_test_career,apply_test_registration_change
          master=Path("fc27-warehouse/FC27_UNIFIED_REFERENCE_WAREHOUSE_V1.sqlite")
          with tempfile.TemporaryDirectory() as directory:
              career_file=Path(directory)/"isolated-career.sqlite"
              result=seed_test_career(master,career_file)
              assert result["clubs"]==659 and result["players"]==17593
              assert result["contracts"]==17593 and result["club_finances"]==659
              assert result["intended_selectable_clubs"]==344
              with sqlite3.connect(career_file) as career:
                  career.execute("PRAGMA foreign_keys=ON")
                  player=career.execute("""
                    SELECT r.player_key,r.current_club_key
                    FROM fc27_demo_career_registrations r
                    JOIN fc27_demo_career_clubs c ON c.career_id=r.career_id
                      AND c.club_key=r.current_club_key
                    WHERE c.intended_manager_selectable=0
                    ORDER BY r.player_key LIMIT 1
                  """).fetchone()
                  target=career.execute("""
                    SELECT club_key FROM fc27_demo_career_clubs
                    WHERE intended_manager_selectable=1
                    ORDER BY club_key LIMIT 1
                  """).fetchone()[0]
                  assert player and target
                  result=apply_test_registration_change(career,career_id="fc27-isolated-qa",
                    player_key=player[0],from_club=player[1],to_club=target,
                    transaction_key="dry-run-1")
                  assert result=="applied"
                  assert apply_test_registration_change(career,career_id="fc27-isolated-qa",
                    player_key=player[0],from_club=player[1],to_club=target,
                    transaction_key="dry-run-1")=="already_applied"
                  assert career.execute("""
                    SELECT COUNT(*) FROM fc27_demo_registration_events
                  """).fetchone()[0]==1
                  assert career.execute("""
                    SELECT original_club_key,current_club_key,revision
                    FROM fc27_demo_career_registrations WHERE player_key=?
                  """,(player[0],)).fetchone()==(player[1],target,1)
              with sqlite3.connect(f"file:{master.resolve().as_posix()}?mode=ro",uri=True) as frozen:
                  assert frozen.execute("""
                    SELECT club_key FROM wh_fc27_starting_rosters
                    WHERE player_key=?
                  """,(player[0],)).fetchone()[0]==player[1]
                  assert frozen.execute("""
                    SELECT COUNT(*) FROM wh_fc27_starting_rosters
                  """).fetchone()[0]==17593
              print(json.dumps({"career_seeded_clubs":659,
                 "career_seeded_players":17593,
                 "single_real_source_player_test_move":True,
                 "career_event_duplicate_rejected":True,
                 "frozen_warehouse_unchanged":True,
                 "production_career_integration":False},indent=2))
          PY
      - name: Download original source-dated 2027 financial circumstances
        uses: actions/download-artifact@v4
        with:
          name: PES-V2-22-SEASON-SOURCED-FINANCIAL-CIRCUMSTANCES
          run-id: 39429984572
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: financial-evidence/
      - name: Enrich FC27 reference with club ambitions, financial pressure, player behaviour and manager hiring policies
        run: |
          python -u -m warehouse.fc27_enrich_decision_dimensions \
            --reference fc27-warehouse/FC27_UNIFIED_REFERENCE_WAREHOUSE_V1.sqlite \
            --circumstances financial-evidence/PES_V2_CLUB_FINANCIAL_CIRCUMSTANCES.sqlite \
            --output fc27-warehouse/FC27_UNIFIED_REFERENCE_WAREHOUSE_AI_DIMENSIONS_V2.sqlite
      - name: Audit explicitly fictional modelled values versus source-backed financial facts
        run: |
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          file=Path("fc27-warehouse/FC27_UNIFIED_REFERENCE_WAREHOUSE_AI_DIMENSIONS_V2.sqlite")
          report=json.loads(file.with_suffix(".decision_audit.json").read_text())
          assert report["club_profiles"]==659
          assert report["club_financial_circumstances"]==659
          assert report["personality_priors"]==17593
          assert report["fictional_manager_recruitment_policies"]==659
          assert report["real_verified_manager_profiles"]==0
          assert report["ai_club_joined_contexts"]==659
          assert report["estimated_club_reputations_without_real_prestige"]==659
          assert report["real_personality_claims"]==0
          assert report["verified_club_cash_debt_or_owner_injection_values"]==0
          assert report["production_careers_unchanged"]
          with sqlite3.connect(file) as db:
              db.execute("PRAGMA foreign_keys=ON")
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("PRAGMA foreign_key_check").fetchall()==[]
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_clubs").fetchone()[0]==659
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_players").fetchone()[0]==17593
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_player_game_personality WHERE observed_real_personality_json IS NOT NULL").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_manager_profiles").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_club_decision_profile WHERE institutional_prestige IS NOT NULL").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_club_financial_circumstances WHERE verified_cash_balance_gbp IS NOT NULL OR verified_net_debt_gbp IS NOT NULL OR verified_owner_capital_injection_gbp IS NOT NULL").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_manager_recruitment_policy WHERE named_manager_source_key IS NOT NULL").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_decision_model_versions").fetchone()[0]==4
              assert db.execute("SELECT COUNT(*) FROM wh_fc27_financial_evidence_events").fetchone()[0]==report["financial_source_events_as_of_preseason"]
              assert db.execute("SELECT COUNT(*) FROM sqlite_master WHERE name LIKE 'world_career_%'").fetchone()[0]==0
          print(json.dumps(report,indent=2))
          print("FC27 AI DECISION REFERENCE BUILT; REAL MANAGERS/PERSONALITY/CASH NOT INVENTED")
          PY
      - name: Publish immutable FC27 reference warehouse snapshot
        uses: actions/upload-artifact@v4
        with:
          name: FC27-POPULATED-UNIFIED-REFERENCE-WAREHOUSE-V1
          path: fc27-warehouse/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
