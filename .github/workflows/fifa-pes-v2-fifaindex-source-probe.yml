name: PES V2 FIFA Index dated league source access probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fifa-pes-v2-fifaindex-source-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe early game league roster pages and inspect actual HTML structure
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,re,html
          for address in ("https://fifaindex.com/leagues/fifa05",
                          "https://fifaindex.com/leagues/13-england-premier-league-1/fifa05",
                          "https://fifaindex.com/leagues/fc26"):
              req=urllib.request.Request(address,headers={
                  "User-Agent":"Mozilla/5.0 (compatible; PES-Historical-Source-Audit/1.0)",
                  "Accept":"text/html,application/xhtml+xml"})
              try:
                  with urllib.request.urlopen(req,timeout=16) as response:
                      data=response.read(2000000).decode("utf-8","replace")
                  print("PAGE",address,"bytes",len(data),
                        "tables",data.lower().count("<table"),"html",data[:220])
                  for line in re.findall(r'<a[^>]+href="[^"]+"[^>]*>.*?</a>',data,re.I|re.S):
                      if "/leagues/" in line or "/teams/" in line:
                          print("ANCHOR",re.sub(r"\s+"," ",line)[:440])
                          if data.index(line)>24000:break
                  assert "<html" in data.lower()
              except Exception as e:
                  print("SOURCE_ACCESS_FAILED",address,type(e).__name__,str(e))
          PY
