name: AI transfer market stress test
on:
  workflow_dispatch:
  push:
    paths:
      - 'qa_twenty_windows.py'
      - 'world_*.py'
      - '.github/workflows/qa-market.yml'
concurrency:
  group: ai-market-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulated-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run twenty end-to-end 30-minute market windows
        run: python -u qa_twenty_windows.py --windows 20 --output qa-20-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-20-window-audit
          path: qa-20-windows.json
          if-no-files-found: warn
