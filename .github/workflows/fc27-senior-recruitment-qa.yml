name: FC27 senior first-team replacement logic regressions
on:
  workflow_dispatch:
  push:
    paths:
      - 'world_ai_world.py'
      - 'world_fc27_ai_recruitment.py'
      - 'world_live_buying.py'
      - 'scripts/fc27_warehouse_world_bridge.py'
      - 'test_world_fc27_ai_recruitment.py'
      - 'world_squad_planner.py'
      - 'world_ai_tactics.py'
      - 'world_fc27_market_choices.py'
      - 'world_fc27_contract_terms.py'
      - 'test_world_fc27_contract_terms.py'
      - 'world_fc27_market_schedule.py'
      - 'world_fc27_decision_audit.py'
      - 'world_fc27_target_finances.py'
      - 'test_world_fc27_target_finances.py'
      - 'test_world_fc27_market_schedule.py'
      - 'world_careers.py'
      - 'world_valuation.py'
      - 'world_career_selling.py'
      - 'test_world_fc27_market_choices.py'
      - 'world_ai_bidding.py'
      - 'world_selling_club.py'
      - 'world_career_board_policy.py'
      - 'world_live_market.py'
      - 'world_recruitment_strategy.py'
      - 'test_world_recruitment_strategy.py'
      - 'test_world_squad_planner.py'
      - 'test_world_ai_replacement_outlook.py'
      - 'test_world_market_decision_policy.py'
      - '.github/workflows/fc27-senior-recruitment-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-backed projected-squad and autonomous AI decision tests
        run: |
          python -m unittest -v test_world_squad_planner test_world_recruitment_strategy test_world_ai_replacement_outlook test_world_fc27_ai_recruitment test_world_market_decision_policy test_world_fc27_market_choices test_world_fc27_market_schedule test_world_fc27_target_finances test_world_fc27_contract_terms
      - name: Verify AI does not require purchasing a replacement before sale
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("world_ai_world.py").read_text()
          assert "recent_senior_departure=new_recruit" in p
          assert "buyer_recruitment_priority" in p
          assert "domestic_market_preference" not in p
          assert "preferred_formation" in p
          assert "starting_roles=club_tactics.get(buyer)" in p
          assert "for buyer in buyers:" in p
          assert "select_recruiting_club" in p
          assert "buying_club_id=None" in p
          assert "Explicit AI buyer is only valid for FC27" in p
          live=Path("world_live_market.py").read_text()
          assert "if fc27_club_led:" in live
          assert "process_fc27_market_interval" in live
          assert "# IMMUTABLE older careers use their original replay-safe moment" in live
          assert "pursue_transfer" in p
          assert "options=[o for o in options" in p
          assert "for seller,pid,overall,need,_score,fit,sale,replacement_plan in options:" in p
          assert "if approaches>=AI_APPROACHES_PER_ATTEMPT" not in p
          inbox=Path("world_live_market.py").read_text()
          assert "MAX_NEW_BIDS" not in inbox
          assert "MAX_GK_BIDS" not in inbox
          from world_ai_tactics import FORMATION_STARTERS
          assert all(sum(shape.values())==11 for shape in FORMATION_STARTERS.values())
          assert "candidate_sporting_priority" in p
          assert "ledger[club][0]-commitments.get(club,0)>0" in p
          assert "ledger[club][1]-future_wages.get(club,0)>0" in p
          assert "not club_ai_context and" in p
          assert "positional_family_priorities" in p
          assert "contextual_policy=bool(club_ai_context)" in p
          assert "not club_ai_context and family==\"GK\"" in p
          assert "not club_ai_context and family==\"FWD\"" in p
          assert "if existing>=MAX_AI_DEALS" not in p
          assert "MAX_SIGNINGS_PER_AI_CLUB" not in p
          assert "MAX_OUTGOING_PER_AI_CLUB" not in p
          assert "protected_exception is None:" not in p
          assert "club_ratings and overall>max(club_ratings)+14" not in p
          print("SENIOR SOURCE-RATED REPLACEMENTS ELIGIBLE; NO PRE-SALE SIGNING OR PER-CLUB QUOTA")
          PY
