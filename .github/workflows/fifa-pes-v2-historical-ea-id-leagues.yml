name: PES V2 pinned FIFA15-23 original EA team league identity review
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_historical_ea_team_id_leagues.py'
      - 'test_audit_historical_ea_team_id_leagues.py'
      - '.github/workflows/fifa-pes-v2-historical-ea-id-leagues.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_audit_historical_ea_team_id_leagues
      - uses: actions/download-artifact@v4
        with:
          name: PES-V2-22-YEAR-MENS-ONLY-CLUBS-LEAGUES-AND-SQUADS
          run-id: 39409971210
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original/
      - name: Verify immutable 2015-2023 men's game club source file
        run: |
          python - <<'PY'
          import hashlib,urllib.request
          p="teams.csv"
          url="https://huggingface.co/datasets/jsulz/FIFA23/resolve/80076aed77a08db5cfad31bfdfa2cebc579e9500/male_teams.csv"
          check="22b7d55ba67c8e07c5f496386ce0a9a0cccb00f40cea42d2be62a71563af2a71"
          hash=hashlib.sha256();size=0
          with urllib.request.urlopen(url,timeout=180) as source,open(p,"wb") as target:
              for chunk in iter(lambda:source.read(1048576),b""):
                  size+=len(chunk)
                  if size>130000000:raise ValueError("Unsafe unexpected file size")
                  hash.update(chunk);target.write(chunk)
          assert hash.hexdigest()==check,(size,hash.hexdigest())
          print("Pinned EA teams CSV:",size,"bytes")
          PY
      - run: |
          python -u -m scripts.audit_historical_ea_team_id_leagues \
             --source original/PES_V2_22_EDITION_CLUB_SQUAD_MAP.sqlite \
             --teams teams.csv --output release/
      - name: Reconcile authenticated edition-specific game ID mappings
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("release")
          j=json.loads((p/"EA_GAME_TEAM_ID_LEAGUE_AUDIT.json").read_text())
          with (p/"EA_GAME_TEAM_LEAGUE_EXACT_ID_REVIEW.csv").open(encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==j["same_edition_ea_game_ids_with_domestic_league"]
          assert len(set((r["Edition"],r["EA_Team_ID"]) for r in rows))==len(rows)
          assert j["no_cross_edition_club_migration"]
          assert j["no_auto_career_ready"]
          print(json.dumps(j,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PES-V2-PINNED-FIFA15-23-EXACT-EA-ID-SAME-EDITION-LEAGUE-EVIDENCE
          path: release/
          retention-days: 30
          if-no-files-found: error
